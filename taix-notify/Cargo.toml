[package]
name = "taix-notify"
version = "0.1.0"
edition = "2021"

[dependencies]
notify-rust = "4"
tracing = { version = "0.1", features = ["release_max_level_off"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
