name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '产物版本号（手动触发用；打 tag 时以 tag 名为准）'
        required: false
        default: '0.0.0-test'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        cpu: [ x64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            taix-server
            taix-monitor-windows
            taix-shell
            taix-installer

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            taix-webui/package-lock.json
            taix-plugins/reminder/ui/package-lock.json

      - name: Set APP_VERSION environment variable
        shell: pwsh
        run: |
          $appVersion = "${{ github.event.inputs.version }}"
          if ("${{ github.ref }}" -match '^refs/tags/v') {
            $appVersion = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ([string]::IsNullOrEmpty($appVersion)) { $appVersion = '0.0.0' }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$appVersion"

      - name: Build Rust taix-server
        run: |
          cd taix-server
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Rust taix-monitor-windows
        run: |
          cd taix-monitor-windows
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Rust taix-shell
        run: |
          cd taix-shell
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Build and Publish .NET Client
        run: |
          Write-Host "Publishing with AOT enabled"
          dotnet publish -c Release -r win-${{ matrix.cpu }} --self-contained true -p:PublishAot=true -p:DebugType=None -p:DebugSymbols=false -p:IlcGenerateStackTraceData=false -p:DebuggerSupport=false -p:StartupHookSupport=false -p:StackTraceSupport=false -p:HttpActivityPropagationSupport=false -p:MetadataUpdaterSupport=false -p:EnableUnsafeUTF7Encoding=false -p:EventSourceSupport=false -p:MetricsSupport=false -p:UseSystemResourceKeys=true -p:Http3Support=false -p:AssemblyTitle=Taix -p:Product=Taix Taix.Client/Taix.Client.csproj -o ./output/${{ matrix.cpu }}/dotnet

      - name: Extract single-file executable
        shell: pwsh
        run: |
          $publishDir = "./output/${{ matrix.cpu }}"
          # 静态单文件发布：仅提取 Taix.exe，丢弃 lib/lib/dll/pdb 等构建残留
          Copy-Item "$publishDir/dotnet/Taix.exe" -Destination $publishDir -Force
          Remove-Item "$publishDir/dotnet" -Recurse -Force
          Write-Host "Published single file: $(Get-Item "$publishDir/Taix.exe" | Select-Object -ExpandProperty Length) bytes"

      - name: Copy Rust binaries
        shell: pwsh
        run: |
          $publishDir = "./output/${{ matrix.cpu }}"

          Copy-Item "taix-server/target/x86_64-pc-windows-msvc/release/taix-server.exe"       -Destination $publishDir -Force
          Copy-Item "taix-monitor-windows/target/x86_64-pc-windows-msvc/release/taix-monitor-windows.exe" -Destination $publishDir -Force
          Copy-Item "taix-shell/target/x86_64-pc-windows-msvc/release/taix-shell.exe"         -Destination $publishDir -Force

          Copy-Item "taix-shell/resources" -Destination $publishDir -Recurse -Force

          # Remove macOS-only files
          Get-ChildItem -Path "$publishDir/resources" -Recurse -Include "*.icns" -File | Remove-Item -Force

      - name: Build webui 与 reminder 插件产物
        shell: pwsh
        run: |
          npm ci --prefix taix-webui
          npm run build --prefix taix-webui
          npm ci --prefix taix-plugins/reminder/ui
          npm run build --prefix taix-plugins/reminder/ui
          Push-Location taix-plugins/reminder
          cargo build --release --target x86_64-pc-windows-msvc
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }

      - name: 把 webui 与插件放进安装包
        shell: pwsh
        run: |
          $publishDir = "./output/${{ matrix.cpu }}"
          $need = @(
            "taix-webui/dist/index.html",
            "taix-plugins/reminder/ui/dist/config.js",
            "taix-plugins/reminder/target/x86_64-pc-windows-msvc/release/taix-plugin-reminder.exe"
          )
          foreach ($f in $need) {
            if (-not (Test-Path $f)) { throw "缺少产物：$f" }
          }
          Copy-Item "taix-webui/dist" -Destination "$publishDir/webui" -Recurse -Force
          $plug = "$publishDir/plugins/reminder"
          New-Item -ItemType Directory -Force -Path "$plug/ui" | Out-Null
          Copy-Item "taix-plugins/reminder/plugin.json" -Destination $plug -Force
          Copy-Item "taix-plugins/reminder/target/x86_64-pc-windows-msvc/release/taix-plugin-reminder.exe" -Destination $plug -Force
          Copy-Item "taix-plugins/reminder/ui/dist/config.js" -Destination "$plug/ui" -Force
          Write-Host "已放入 webui 与 plugins/reminder（含 ui）"

      - name: Install 7-Zip for ultra compression
        shell: pwsh
        run: |
          choco install 7zip -y
          # 确保 7z 命令可用
          7z | Out-Null
          Write-Host "7-Zip installed successfully"

      - name: Copy install/uninstall scripts
        shell: pwsh
        run: |
          $publishDir = "./output/${{ matrix.cpu }}"
          Copy-Item "script/install.ps1"   -Destination $publishDir -Force
          Copy-Item "script/uninstall.ps1" -Destination $publishDir -Force

      - name: Build Installer
        shell: bash
        run: |
          bash taix-installer/build-installer.sh "output/${{ matrix.cpu }}" "${{ env.APP_VERSION }}" "."

      - name: Create ZIP
        shell: pwsh
        run: |
          $publishDir = "./output/${{ matrix.cpu }}"

          $zipName = "Taix-${{ env.APP_VERSION }}-win-${{ matrix.cpu }}"
          Push-Location $publishDir
          Compress-Archive -Path "*" -DestinationPath "../../$zipName.zip"
          Pop-Location
          Write-Host "Created $zipName.zip"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-win-${{ matrix.cpu }}-Setup
          path: Taix-${{ env.APP_VERSION }}-Setup.exe

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-win-${{ matrix.cpu }}
          path: Taix-${{ env.APP_VERSION }}-win-${{ matrix.cpu }}.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            taix-server
            taix-shell
            taix-plugins/reminder

      - name: Set APP_VERSION
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [[ -z "$VERSION" ]]; then VERSION="0.0.0"; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            taix-webui/package-lock.json
            taix-plugins/reminder/ui/package-lock.json

      # 一条命令搞定前端 → 插件 → Rust/Swift → .app/TaixTools → DMG，
      # 和本地 script/package-macos.sh 完全同一条路径
      - name: 打包
        run: bash script/package-macos.sh "${{ env.APP_VERSION }}" "$GITHUB_WORKSPACE/dist"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-macos-arm64
          path: dist/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set APP_VERSION
        run: |
          VERSION="${{ github.ref_name }}"
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-win-x64-Setup
          path: ./artifacts

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-win-x64
          path: ./artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: Taix-${{ env.APP_VERSION }}-macos-arm64
          path: ./artifacts

      - name: Read release notes
        id: release-notes
        run: |
          if [ -f release_notes.txt ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            sed -e "s/{version}/${{ env.APP_VERSION }}/g" \
                release_notes.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Release ${{ env.APP_VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: ./artifacts/*
          body: ${{ steps.release-notes.outputs.content }}
