[package]
name = "taix-plugin-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
attohttpc = { version = "0.28", default-features = false, features = ["tls-native"] }
anyhow = "1"
taix-logging = { path = "../taix-logging" }
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_Security 为 CreateMutexW 的 SECURITY_ATTRIBUTES 形参所需
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
