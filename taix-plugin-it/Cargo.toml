[package]
name = "taix-plugin-it"
version = "0.1.0"
edition = "2021"
publish = false

# 传输契约集成测试：进程内起真实 taix-server（lib 组装，与生产同一路由），
# 用真实 taix-plugin-sdk 跑插件线程，锁死「指令 / 配置 / 状态 / 重启」契约。
# 运行：cd taix-plugin-it && cargo test（仓库无根 workspace，不能用 -p）

[dependencies]
taix-plugin-sdk = { path = "../taix-plugin-sdk" }
taix-server = { path = "../taix-server" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "sqlite", "runtime-tokio", "chrono"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
attohttpc = { version = "0.28", default-features = false, features = ["tls-native"] }
